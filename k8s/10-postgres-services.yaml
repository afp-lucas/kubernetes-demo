apiVersion: v1
kind: Service

metadata:
  name: postgres
  namespace: essay-manager

spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---

apiVersion: v1
kind: Service

metadata:
  name: postgres-headless
  namespace: essay-manager

spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432